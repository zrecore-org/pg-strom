# Drop-in for postgresql-NN.service, installed by the pg_strom package.
# pgstrom-gpuserv (the GPU service) is started by a PostgreSQL background worker, so it
# runs in the same service unit and inherits these limits.
[Service]
LimitNOFILE=65536
LimitCORE=infinity
# A Vulkan driver reaches the GPU through /dev/dri/renderD*; on most Linux distributions
# the postgres user must be allowed to open it, for example through the 'render' group.
# (General Vulkan practice; not tested on this branch, whose only validated platform is
# macOS.) Uncomment if the probe in the PostgreSQL log finds no device:
#SupplementaryGroups=render
