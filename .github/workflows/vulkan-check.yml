name: Vulkan Check

# CI for the Vulkan port (branch vulkan-gpu). The CUDA line has its own workflow,
# build-check.yml, which only applies to master.
#
# What these jobs can and cannot show (read before trusting a green check):
#   * linux-lavapipe: builds the module and pgstrom-gpuserv and runs the service lifecycle
#     test and a bounded GPU-versus-CPU differential test (float8 and GPU-Cache dev
#     scripts on small tables) on lavapipe, Mesa's CPU implementation of Vulkan. The full
#     scan_test.sh (about 2400 checks) does not fit a hosted runner: lavapipe needs 3 to 5
#     minutes for each join-aggregate query, so it runs on the Apple Silicon machine only. There is NO GPU in a GitHub-hosted runner, so this checks the host code,
#     the SPIR-V kernels' logic and the SQL results, not GPU behaviour or speed. Lavapipe
#     reports the "desktop" capability tier, so the kernels run in a different tier than on
#     Apple Silicon (the base tier).
#   * macos-build: builds on an Apple Silicon runner and runs the portability test. It does
#     not run the GPU tests: a GitHub-hosted macOS VM has no usable Metal device. MoltenVK
#     aborts in vkCreateInstance there (AppleParavirtDevice does not implement
#     newArgumentEncoderWithArguments), so `pgstrom-gpuserv --probe` crashes on the runner;
#     the probe step is informational (continue-on-error) and nothing depends on it.
#   * macos-gpu-test: the only job that runs the GPU tests on real Apple Silicon. It needs a
#     self-hosted runner and runs on manual dispatch only.
#
# The arm64 Linux runner label (ubuntu-24.04-arm) is available for public repositories; a
# private fork needs its own arm64 runner or must drop that matrix entry.
#
# None of this has been run by the author of the file (no CI run was possible from the
# development machine); the first run will likely need adjustments.

on:
  push:
    branches: [vulkan-gpu]
  pull_request:
    branches: [vulkan-gpu]
  workflow_dispatch:
    inputs:
      run_apple_gpu_tests:
        description: "Run the GPU tests on a self-hosted Apple Silicon runner"
        type: boolean
        default: false
      try_xlarge_runner:
        description: "Probe for a Metal device on the GitHub-hosted macos-latest-xlarge runner (billed per minute)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same ref replaces the run in progress (a lavapipe run is long).
concurrency:
  group: vulkan-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Slang release; the sha256 values are the digests GitHub reports for the assets.
  # (The Makefile in src/gpuserv looks for ~/tools/slang-2026.20/bin/slangc by itself.)
  SLANG_VERSION: "2026.20"
  PG_MAJOR: "17"
  # where the Linux jobs keep compiled shaders between runs (the cache step below restores them)
  MESA_SHADER_CACHE_DIR: ${{ github.workspace }}/.cache/mesa
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg

jobs:
  linux-lavapipe:
    name: Linux ${{ matrix.arch }}, lavapipe (CPU Vulkan, no GPU), PostgreSQL 17
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            slang_asset: slang-2026.20-linux-x86_64.tar.gz
            slang_sha256: e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9
          - arch: arm64
            runner: ubuntu-24.04-arm
            slang_asset: slang-2026.20-linux-aarch64.tar.gz
            slang_sha256: b0345743e2153d8c2bd33f56fb5696bcef63fc03513f054a1ae1b8d3dd0152a9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A slow mirror once spent 36 minutes in the PostgreSQL install and the job ran out of its 120 minutes before
      # any test started: the install steps fail fast instead, and apt retries a stalled download.
      - name: Install build and runtime packages
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget lsb-release gnupg build-essential pkgconf \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libnuma-dev libkrb5-dev libicu-dev postgresql-common

      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        timeout-minutes: 10
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR}
          # the build installs into the PostgreSQL tree: let the runner user write there
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}

      - name: Install Apache Arrow and Parquet (Apache apt repository)
        timeout-minutes: 10
        run: |
          wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${{ matrix.slang_asset }}"
          echo "${{ matrix.slang_sha256 }}  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      # A kernel changes rarely, so the driver's compiled shaders (lavapipe: Mesa's shader cache; the service's
      # pipeline cache) are kept between runs. The key follows the kernel sources: a changed kernel recompiles,
      # the others are found in the restored cache.
      - name: Restore the shader and pipeline caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/mesa
            .cache/xdg
          key: shader-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}
          restore-keys: |
            shader-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Show the Vulkan devices (informational)
        continue-on-error: true
        run: vulkaninfo --summary | head -40

      - name: Build and install
        run: |
          PG_CONFIG=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
          make -C src PG_CONFIG=$PG_CONFIG WITH_GPUSERV=1 -j"$(nproc)" install

      - name: Portability layer test
        run: make -C test/port check

      - name: Service lifecycle test (lavapipe)
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
        run: sh test/gpuserv/service_test.sh

      # Bounded subset of the differential tests, on small tables (the full scan_test.sh is
      # too slow on lavapipe, see the header). Each script compares the GPU path with
      # pg_strom.enabled=off and exits non-zero on a difference.
      - name: Differential test, float8 (lavapipe)
        timeout-minutes: 30
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
          F8ROWS: "20000"
          F8PARTS: scan
        run: sh test/gpuserv/float8_dev.sh

      - name: Differential test, GPU-Cache (lavapipe)
        # lavapipe compiles every kernel variant on the CPU (1-2 minutes each), so the time is set by the number
        # of distinct queries, not the row count: the arm64 run passed 55 checks in 30 minutes and was killed in the join section
        timeout-minutes: 60
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
          NROWS: "20000"
          GCJOINS: "off"       # lavapipe needs more than 5 minutes and 7 GB to compile the Arrow-source join kernel
        run: sh test/gpuserv/gpucache_dev.sh

      - name: Upload the PostgreSQL log of the failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgstrom-test-logs-${{ matrix.arch }}
          path: |
            /tmp/f8_dev/log
            /tmp/gc_dev/log
          if-no-files-found: ignore

  macos-build:
    name: macOS Apple Silicon, build only (no GPU test), PostgreSQL 17
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages (Homebrew)
        run: brew install postgresql@17 apache-arrow pkgconf molten-vk vulkan-loader vulkan-headers

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz"
          echo "07fa8833fdbb343c3674c84fdd885910f495f3daaaa0c732b32980151e8b58c4  /tmp/slang.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      - name: Build and install
        # src/gpuserv/Makefile defaults to the Vulkan SDK in /usr/local on macOS; with
        # Homebrew the headers and the loader are elsewhere, so name them.
        run: |
          PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          VKH="$(brew --prefix vulkan-headers)"
          VKL="$(brew --prefix vulkan-loader)"
          make -C src PG_CONFIG="$PG_CONFIG" WITH_GPUSERV=1 \
            VK_CFLAGS="-I$VKH/include" \
            VK_LIBS="-L$VKL/lib -lvulkan -Wl,-rpath,$VKL/lib" \
            -j"$(sysctl -n hw.ncpu)" install

      - name: Portability layer test
        run: make -C test/port check

      - name: Probe the Vulkan devices (informational)
        # The result decides nothing: a hosted macOS VM may have no usable Metal device.
        continue-on-error: true
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          "$PKGLIB/pgstrom-gpuserv" --probe

  macos-gpu-test:
    name: Apple Silicon GPU tests (self-hosted runner, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_apple_gpu_tests
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install into the runner's PostgreSQL and run the tests
        # needs PostgreSQL 17 from Homebrew, Slang and a Vulkan loader with MoltenVK installed
        # on the runner as in CLAUDE.md; locked_test.sh builds, installs and runs the test.
        run: |
          sh test/gpuserv/locked_test.sh "$PWD" service_test.sh
          sh test/gpuserv/locked_test.sh "$PWD" scan_test.sh

  macos-xlarge-probe:
    # Experiment, manual dispatch only (a larger runner is billed per minute and needs a plan that has them): does the
    # GitHub-hosted Apple silicon "xlarge" runner expose a Metal device to MoltenVK? The 2023 announcement says GPU
    # acceleration is on by default; the current docs say Metal Performance Shaders are not supported in the
    # virtualized runner. Nothing depends on this job; if the probe finds a device, the service test below runs.
    name: macOS xlarge runner, Metal device probe (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.try_xlarge_runner
    runs-on: macos-latest-xlarge
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: What the runner reports
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType || true

      - name: Install packages (Homebrew)
        run: brew install postgresql@17 apache-arrow pkgconf molten-vk vulkan-loader vulkan-headers

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz"
          echo "07fa8833fdbb343c3674c84fdd885910f495f3daaaa0c732b32980151e8b58c4  /tmp/slang.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"

      - name: Build and install
        run: |
          PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          VKH="$(brew --prefix vulkan-headers)"
          VKL="$(brew --prefix vulkan-loader)"
          make -C src PG_CONFIG="$PG_CONFIG" WITH_GPUSERV=1 \
            VK_CFLAGS="-I$VKH/include" \
            VK_LIBS="-L$VKL/lib -lvulkan -Wl,-rpath,$VKL/lib" \
            -j"$(sysctl -n hw.ncpu)" install

      - name: Probe the Vulkan devices
        id: probe
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          "$PKGLIB/pgstrom-gpuserv" --probe

      - name: Service lifecycle test on the Metal device
        if: steps.probe.outcome == 'success'
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          PGBIN="$(brew --prefix postgresql@17)/bin" GPUSERV_BIN="$PKGLIB/pgstrom-gpuserv" sh test/gpuserv/service_test.sh

  linux-gpu:
    # A real NVIDIA GPU (GitHub-hosted GPU larger runner, Tesla T4, or any self-hosted Linux runner with a GPU).
    # Off until the repository variable GPU_RUNNER_LABEL names the runner (Settings > Secrets and variables >
    # Actions > Variables); GPU larger runners need an organization on the Team or Enterprise Cloud plan, see
    # doc/ci-gpu-runners.md. Unlike the lavapipe job this runs the full GPU path with ALLOW_CPU off: the service
    # must pick the GPU, and the differential tests compare it with the CPU.
    name: Linux x86_64, real GPU (${{ vars.GPU_RUNNER_LABEL }}), PostgreSQL 17
    if: vars.GPU_RUNNER_LABEL != ''
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A slow mirror once spent 36 minutes in the PostgreSQL install and the job ran out of its 120 minutes before
      # any test started: the install steps fail fast instead, and apt retries a stalled download.
      - name: Install build and runtime packages
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget lsb-release gnupg build-essential pkgconf \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libnuma-dev libkrb5-dev libicu-dev postgresql-common

      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        timeout-minutes: 10
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR}
          # the build installs into the PostgreSQL tree: let the runner user write there
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}

      - name: Install Apache Arrow and Parquet (Apache apt repository)
        timeout-minutes: 10
        run: |
          wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-2026.20-linux-x86_64.tar.gz"
          echo "e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      # A kernel changes rarely, so the driver's compiled shaders (lavapipe: Mesa's shader cache; the service's
      # pipeline cache) are kept between runs. The key follows the kernel sources: a changed kernel recompiles,
      # the others are found in the restored cache.
      - name: Restore the shader and pipeline caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/mesa
            .cache/xdg
          key: shader-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}
          restore-keys: |
            shader-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: What the GPU runner has (informational)
        continue-on-error: true
        run: |
          nvidia-smi || echo "no nvidia-smi: the image has no NVIDIA driver"
          vulkaninfo --summary | head -60
          ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true

      - name: Build and install
        run: |
          PG_CONFIG=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
          make -C src PG_CONFIG=$PG_CONFIG WITH_GPUSERV=1 -j"$(nproc)" install

      - name: Service lifecycle test (the GPU, not lavapipe)
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "off"
        run: sh test/gpuserv/service_test.sh

      - name: Differential tests (float8, PostGIS, GiST join, GPU-Cache)
        timeout-minutes: 60
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "off"
        run: |
          sh test/gpuserv/float8_dev.sh
          sh test/gpuserv/postgis_dev.sh
          sh test/gpuserv/gist_dev.sh
          sh test/gpuserv/gpucache_dev.sh

      - name: Upload the PostgreSQL logs of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgstrom-test-logs-gpu
          path: |
            /tmp/f8_dev/log
            /tmp/pg_dev/log
            /tmp/pg_gist_dev/log
            /tmp/gc_dev/log
          if-no-files-found: ignore
