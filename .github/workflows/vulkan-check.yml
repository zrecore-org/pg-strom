name: Vulkan Check

# CI for the Vulkan port (branch vulkan-gpu). The CUDA line has its own workflow,
# build-check.yml, which only applies to master.
#
# What these jobs can and cannot show (read before trusting a green check):
#   * linux-lavapipe: builds the module and pgstrom-gpuserv and runs the service lifecycle
#     test and a bounded GPU-versus-CPU differential test (float8 and GPU-Cache dev
#     scripts on small tables) on lavapipe, Mesa's CPU implementation of Vulkan. The full
#     scan_test.sh (about 2400 checks) does not fit a hosted runner: lavapipe needs 3 to 5
#     minutes for each join-aggregate query, so it runs on the Apple Silicon machine only. There is NO GPU in a GitHub-hosted runner, so this checks the host code,
#     the SPIR-V kernels' logic and the SQL results, not GPU behaviour or speed. Lavapipe
#     reports the "desktop" capability tier, so the kernels run in a different tier than on
#     Apple Silicon (the base tier).
#   * macos-build: builds on an Apple Silicon runner and runs the portability test. It does
#     not run the GPU tests: a GitHub-hosted macOS VM has no usable Metal device. MoltenVK
#     aborts in vkCreateInstance there (AppleParavirtDevice does not implement
#     newArgumentEncoderWithArguments), so `pgstrom-gpuserv --probe` crashes on the runner;
#     the probe step is informational (continue-on-error) and nothing depends on it.
#   * macos-gpu-test: the only job that runs the GPU tests on real Apple Silicon. It needs a
#     self-hosted runner and runs on manual dispatch only.
#
# The arm64 Linux runner label (ubuntu-24.04-arm) is available for public repositories; a
# private fork needs its own arm64 runner or must drop that matrix entry.
#
# None of this has been run by the author of the file (no CI run was possible from the
# development machine); the first run will likely need adjustments.

on:
  push:
    branches: [vulkan-gpu]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'doc/**'
      - 'man/**'
      - 'docs/**'
  pull_request:
    branches: [vulkan-gpu]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'doc/**'
      - 'man/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_apple_gpu_tests:
        description: "Run the GPU tests on a self-hosted Apple Silicon runner"
        type: boolean
        default: false
      skip_gpu_job:
        description: "Do not run the billed NVIDIA T4 job in this manual run"
        type: boolean
        default: false
      apt_offline:
        description: "Block the Ubuntu mirrors in the Linux jobs: the cached apt packages must be enough (a test of the cache)"
        type: boolean
        default: false
      bench_gpu:
        description: "Run perf_bench.sh on the NVIDIA T4 after the tests (informational; adds the benchmark minutes to the billed job)"
        type: boolean
        default: false
      try_xlarge_runner:
        description: "Probe for a Metal device on the GitHub-hosted macos-latest-xlarge runner (billed per minute)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same ref replaces the run in progress (a lavapipe run is long). A manual run is its own group: starting
# one must not cancel another (a cancelled T4 run is billed for the minutes it ran).
concurrency:
  group: vulkan-check-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Pinned Slang release; the sha256 values are the digests GitHub reports for the assets.
  # (The Makefile in src/gpuserv looks for ~/tools/slang-2026.20/bin/slangc by itself.)
  SLANG_VERSION: "2026.20"
  PG_MAJOR: "17"
  # where the Linux jobs keep compiled shaders between runs (the cache step below restores them)
  MESA_SHADER_CACHE_DIR: ${{ github.workspace }}/.cache/mesa
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg

jobs:
  linux-lavapipe:
    name: Linux ${{ matrix.arch }}, lavapipe (CPU Vulkan, no GPU), PostgreSQL 17
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            slang_asset: slang-2026.20-linux-x86_64.tar.gz
            slang_sha256: e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9
          - arch: arm64
            runner: ubuntu-24.04-arm
            slang_asset: slang-2026.20-linux-aarch64.tar.gz
            slang_sha256: b0345743e2153d8c2bd33f56fb5696bcef63fc03513f054a1ae1b8d3dd0152a9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A slow mirror once spent 36 minutes in the PostgreSQL install and the job ran out of its 120 minutes before
      # any test started: the install steps fail fast instead, and apt retries a stalled download.
      - name: Apt cache
        uses: ./.github/actions/apt-cache
        with:
          offline: ${{ inputs.apt_offline || 'false' }}
          key-extra: lavapipe

      - name: Install build and runtime packages
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "1"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          # an unreachable index (security.ubuntu.com was down on 2026-11-11) must not fail the step: install from the rest
          sudo apt-get update || echo "apt-get update had errors; continuing with the indexes that answered"
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget lsb-release gnupg build-essential pkgconf \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libnuma-dev libkrb5-dev libicu-dev postgresql-common

      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        timeout-minutes: 25
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          # the Azure Ubuntu mirror sometimes serves a package at a few KB/s (llvm-19-dev, a dependency of the server
          # headers, stalled for 5 minutes): a stalled attempt is cut off and retried, finished downloads are kept
          for try in 1 2 3 4; do
            sudo timeout 420 apt-get install -y --no-install-recommends postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR} && break
            [ "$try" = 4 ] && exit 1
            sudo dpkg --configure -a || true
          done
          # the build installs into the PostgreSQL tree: let the runner user write there
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}

      - name: Install Apache Arrow and Parquet (Apache apt repository)
        timeout-minutes: 10
        run: |
          wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update || echo "apt-get update had errors; continuing with the indexes that answered"
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${{ matrix.slang_asset }}"
          echo "${{ matrix.slang_sha256 }}  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      # A kernel changes rarely, so the driver's compiled shaders (lavapipe: Mesa's shader cache; the service's
      # pipeline cache) are kept between runs. The key follows the kernel sources: a changed kernel recompiles,
      # the others are found in the restored cache.
      # lavapipe JIT-compiles for the host CPU and Mesa's shader cache is not keyed by CPU features: objects cached on a
      # runner with a wider instruction set made the probe die with SIGILL (status 0x84) on a narrower one.
      - name: CPU fingerprint for the cache key
        run: |
          grep -m1 -i -E '^(model name|Features|flags)' /proc/cpuinfo | cut -c1-200
          echo "CPUKEY=$(grep -i -E '^(model name|flags|Features)' /proc/cpuinfo | sort -u | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      # restore and save are separate steps: actions/cache saves only when the whole job succeeds, so a run that
      # fails after its slow cold compiles would leave the next run just as cold (the saving step below runs always).
      - name: Restore the shader and pipeline caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/mesa
            .cache/xdg
          key: shader-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.CPUKEY }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}
          restore-keys: |
            shader-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.CPUKEY }}-

      - name: Show the Vulkan devices (informational)
        continue-on-error: true
        run: vulkaninfo --summary | head -40

      - name: Build and install
        run: |
          PG_CONFIG=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
          make -C src PG_CONFIG=$PG_CONFIG WITH_GPUSERV=1 -j"$(nproc)" install

      - name: Portability layer test
        run: make -C test/port check

      - name: Service lifecycle test (lavapipe)
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
        run: sh test/gpuserv/service_test.sh

      # Bounded subset of the differential tests, on small tables (the full scan_test.sh is
      # too slow on lavapipe, see the header). Each script compares the GPU path with
      # pg_strom.enabled=off and exits non-zero on a difference.
      - name: Differential test, float8 (lavapipe)
        timeout-minutes: 30
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
          F8ROWS: "20000"
          F8PARTS: scan
        run: sh test/gpuserv/float8_dev.sh

      - name: Differential test, GPU-Cache (lavapipe)
        # lavapipe compiles every kernel variant on the CPU (1-2 minutes each), so the time is set by the number
        # of distinct queries, not the row count: the arm64 run passed 55 checks in 30 minutes and was killed in the join section
        timeout-minutes: 60
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "on"
          NROWS: "20000"
          GCJOINS: "off"       # lavapipe needs more than 5 minutes and 7 GB to compile the Arrow-source join kernel
        run: sh test/gpuserv/gpucache_dev.sh

      - name: Save the shader and pipeline caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/mesa
            .cache/xdg
          key: shader-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.CPUKEY }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}

      - name: Save the apt packages
        if: ${{ !cancelled() }}
        uses: ./.github/actions/apt-cache-save
        with:
          key-extra: lavapipe

      - name: Server and GPU service logs of the failed test
        if: failure()
        run: |
          for f in /tmp/f8_dev/log /tmp/gc_dev/log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 150 lines)"
            tail -n 150 "$f"
          done

      - name: Upload the PostgreSQL log of the failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgstrom-test-logs-${{ matrix.arch }}
          path: |
            /tmp/f8_dev/log
            /tmp/gc_dev/log
          if-no-files-found: ignore

  macos-build:
    name: macOS Apple Silicon, build only (no GPU test), PostgreSQL 17
    # Apple Silicon is the supported Mac platform (macOS 26 is the last release for Intel Macs). The job moved to
    # macos-15-intel on 2026-11-06 because macos-26 was never acquired; the standard macos-15 (arm64) label is tried
    # now. If it stays queued, cancel the run and go back to macos-15-intel (the macos-x86_64 Slang asset, sha256
    # b4f01f615dc625f60c593d7d0a4bbd38e05dfa2a34bfd3973017c309d866feaa).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages (Homebrew)
        run: brew install postgresql@17 apache-arrow pkgconf molten-vk vulkan-loader vulkan-headers

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz"
          echo "07fa8833fdbb343c3674c84fdd885910f495f3daaaa0c732b32980151e8b58c4  /tmp/slang.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      - name: Build and install
        # src/gpuserv/Makefile defaults to the Vulkan SDK in /usr/local on macOS; with
        # Homebrew the headers and the loader are elsewhere, so name them.
        run: |
          PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          VKH="$(brew --prefix vulkan-headers)"
          VKL="$(brew --prefix vulkan-loader)"
          make -C src PG_CONFIG="$PG_CONFIG" WITH_GPUSERV=1 \
            VK_CFLAGS="-I$VKH/include" \
            VK_LIBS="-L$VKL/lib -lvulkan -Wl,-rpath,$VKL/lib -Wl,-ld_classic" \
            -j"$(sysctl -n hw.ncpu)" install

      - name: Portability layer test
        run: make -C test/port check

      - name: Probe the Vulkan devices (informational)
        # Skipped on a GitHub-hosted runner: its VM has no usable Metal device and MoltenVK aborts in vkCreateInstance
        # (exit code 134, SIGABRT), which only put an error annotation on the run. A self-hosted runner still probes.
        if: runner.environment != 'github-hosted'
        continue-on-error: true
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          "$PKGLIB/pgstrom-gpuserv" --probe

  macos-gpu-test:
    name: Apple Silicon GPU tests (self-hosted runner, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_apple_gpu_tests
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install into the runner's PostgreSQL and run the tests
        # needs PostgreSQL 17 from Homebrew, Slang and a Vulkan loader with MoltenVK installed
        # on the runner as in CLAUDE.md; locked_test.sh builds, installs and runs the test.
        run: |
          sh test/gpuserv/locked_test.sh "$PWD" service_test.sh
          sh test/gpuserv/locked_test.sh "$PWD" scan_test.sh

  macos-xlarge-probe:
    # Experiment, manual dispatch only (a larger runner is billed per minute and needs a plan that has them): does the
    # GitHub-hosted Apple silicon "xlarge" runner expose a Metal device to MoltenVK? The 2023 announcement says GPU
    # acceleration is on by default; the current docs say Metal Performance Shaders are not supported in the
    # virtualized runner. Nothing depends on this job; if the probe finds a device, the service test below runs.
    name: macOS xlarge runner, Metal device probe (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.try_xlarge_runner
    runs-on: macos-latest-xlarge
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: What the runner reports
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType || true

      - name: Install packages (Homebrew)
        run: brew install postgresql@17 apache-arrow pkgconf molten-vk vulkan-loader vulkan-headers

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-macos-aarch64.tar.gz"
          echo "07fa8833fdbb343c3674c84fdd885910f495f3daaaa0c732b32980151e8b58c4  /tmp/slang.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"

      - name: Build and install
        run: |
          PG_CONFIG="$(brew --prefix postgresql@17)/bin/pg_config"
          VKH="$(brew --prefix vulkan-headers)"
          VKL="$(brew --prefix vulkan-loader)"
          make -C src PG_CONFIG="$PG_CONFIG" WITH_GPUSERV=1 \
            VK_CFLAGS="-I$VKH/include" \
            VK_LIBS="-L$VKL/lib -lvulkan -Wl,-rpath,$VKL/lib" \
            -j"$(sysctl -n hw.ncpu)" install

      - name: Probe the Vulkan devices
        id: probe
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          "$PKGLIB/pgstrom-gpuserv" --probe

      - name: Service lifecycle test on the Metal device
        if: steps.probe.outcome == 'success'
        run: |
          PKGLIB="$("$(brew --prefix postgresql@17)/bin/pg_config" --pkglibdir)"
          PGBIN="$(brew --prefix postgresql@17)/bin" GPUSERV_BIN="$PKGLIB/pgstrom-gpuserv" sh test/gpuserv/service_test.sh

  # Decides whether the billed GPU job runs: always for a manual run; for a push or a pull request only when a file
  # that can change what the GPU executes was touched (host and service sources, kernels, the GPU tests, the build, this
  # workflow). Documentation-only pushes do not spend T4 minutes.
  gpu-changes:
    name: Does the change need the GPU job
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gpu: ${{ steps.f.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gpu=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          elif [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=""
            gpu=true
          fi
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            if echo "$files" | grep -qE '^(src/|test/gpuserv/|test/Makefile|Makefile|\.github/workflows/vulkan-check\.yml)'; then gpu=true; else gpu=false; fi
          fi
          echo "changed files:"; echo "$files" | head -40
          echo "gpu=$gpu" >> "$GITHUB_OUTPUT"

  linux-gpu:
    # A real NVIDIA GPU (GitHub-hosted GPU larger runner, Tesla T4, or any self-hosted Linux runner with a GPU).
    # Off until the repository variable GPU_RUNNER_LABEL names the runner (Settings > Secrets and variables >
    # Actions > Variables); GPU larger runners need an organization on the Team or Enterprise Cloud plan, see
    # doc/ci-gpu-runners.md. Unlike the lavapipe job this runs the full GPU path with ALLOW_CPU off: the service
    # must pick the GPU, and the differential tests compare it with the CPU.
    name: Linux x86_64, real GPU (NVIDIA T4), PostgreSQL 17
    # Never for a pull request from a fork: the runner is billed and shared with the organization.
    # Nor for a manual run that probes the macOS runner or tests the apt cache with the mirrors blocked (those runs exist to
    # spend only the minutes they test).
    if: needs.gpu-changes.outputs.gpu == 'true' && vars.GPU_RUNNER_LABEL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'workflow_dispatch' && (inputs.try_xlarge_runner || inputs.apt_offline || inputs.skip_gpu_job))
    needs: gpu-changes
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A slow mirror once spent 36 minutes in the PostgreSQL install and the job ran out of its 120 minutes before
      # any test started: the install steps fail fast instead, and apt retries a stalled download.
      - name: Apt cache
        uses: ./.github/actions/apt-cache
        with:
          offline: ${{ inputs.apt_offline || 'false' }}
          key-extra: gpu

      - name: Install build and runtime packages
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "1"; Acquire::http::Timeout "15"; Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          # an unreachable index (security.ubuntu.com was down on 2026-11-11) must not fail the step: install from the rest
          sudo apt-get update || echo "apt-get update had errors; continuing with the indexes that answered"
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl wget lsb-release gnupg build-essential pkgconf \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libnuma-dev libkrb5-dev libicu-dev postgresql-common

      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        timeout-minutes: 10
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR}
          # the build installs into the PostgreSQL tree: let the runner user write there
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}

      - name: Install Apache Arrow and Parquet (Apache apt repository)
        timeout-minutes: 10
        run: |
          wget -q "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update || echo "apt-get update had errors; continuing with the indexes that answered"
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Install Slang ${{ env.SLANG_VERSION }}
        run: |
          D="$HOME/tools/slang-${SLANG_VERSION}"
          mkdir -p "$D"
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-2026.20-linux-x86_64.tar.gz"
          echo "e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9  /tmp/slang.tar.gz" | sha256sum -c -
          tar -xzf /tmp/slang.tar.gz -C "$D"
          SLANGC=$(find "$D" -type f -name slangc | head -n 1)
          test -x "$SLANGC"
          echo "SLANGC=$SLANGC" >> "$GITHUB_ENV"
          "$SLANGC" -v

      # A kernel changes rarely, so the driver's compiled shaders (lavapipe: Mesa's shader cache; the service's
      # pipeline cache) are kept between runs. The key follows the kernel sources: a changed kernel recompiles,
      # the others are found in the restored cache.
      # The NVIDIA driver compiles every kernel on the first use (one join-aggregation kernel took 17 minutes on the T4, a
      # whole float8_dev run over an hour): the service's VkPipelineCache holds the compiled binaries. It is saved after the
      # job (even a failed one) under its own key (not the lavapipe job's: a pipeline cache of another device is ignored)
      # and restored by the next run; a changed kernel recompiles only itself.
      - name: Restore the pipeline cache (NVIDIA)
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/xdg
          key: nvidia-pipeline-cache-${{ runner.arch }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}
          restore-keys: |
            nvidia-pipeline-cache-${{ runner.arch }}-

      # The GPU-optimized image (Ubuntu 24.04, driver 590 "server" packages) already ships the NVIDIA Vulkan ICD
      # (libnvidia-gl-590-server). Check it here so that a missing driver fails this step, not the service test.
      - name: NVIDIA Vulkan driver
        timeout-minutes: 5
        run: |
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          test -f /usr/share/vulkan/icd.d/nvidia_icd.json
          vulkaninfo --summary | grep -E 'deviceName|driverName|deviceType' | head -20
          vulkaninfo --summary | grep -q 'NVIDIA'

      - name: What the GPU runner has (informational)
        continue-on-error: true
        run: |
          nvidia-smi || echo "no nvidia-smi: the image has no NVIDIA driver"
          vulkaninfo --summary | head -60
          ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true

      - name: Build and install
        run: |
          PG_CONFIG=/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
          make -C src PG_CONFIG=$PG_CONFIG WITH_GPUSERV=1 -j"$(nproc)" install

      # Informational: which host-visible memory type is fast for the host to read and write (the service's pick_memtype() prefers the
      # device-local one, a 256 MB BAR window on the T4, which the host reads uncached); the numbers decide whether readback buffers
      # should come from a HOST_CACHED type on discrete GPUs.
      - name: Host memory bandwidth per memory type (informational)
        continue-on-error: true
        timeout-minutes: 5
        run: /usr/lib/postgresql/${PG_MAJOR}/lib/pgstrom-gpuserv --probe-memory

      - name: Service lifecycle test (the GPU, not lavapipe)
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "off"
        run: sh test/gpuserv/service_test.sh

      - name: Differential tests (float8, PostGIS, GiST join, GPU-Cache)
        timeout-minutes: 105   # a cold NVIDIA kernel compile takes tens of minutes; with the pipeline cache a run is much shorter
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "off"
          # As locked_test.sh does for every local test run: a task waits for a kernel that the driver is still compiling (the
          # service otherwise refuses it after pg_strom.gpu_kernel_wait and the node continues on the CPU, which the
          # "No GPU task fell back" step below reports) and the background prewarm stays off. A kernel change makes the saved
          # pipeline cache cold for that kernel.
          PGSTROM_GPUSERV_KERNEL_WAIT_MS: "-1"
          PGSTROM_GPUSERV_PREWARM: "off"
        run: |
          sh test/gpuserv/float8_dev.sh
          sh test/gpuserv/postgis_dev.sh
          sh test/gpuserv/gist_dev.sh
          sh test/gpuserv/gpucache_dev.sh

      # A node whose GPU task fails continues on the CPU and returns the CPU's rows (A14), so a differential test passes even when
      # the device's shader compiler rejected the kernel (the T4 did that for every scan kernel with the numeric group). A pass of
      # this job must mean that the GPU path ran: no pipeline creation or device error may appear in the service logs.
      # (Injected faults, which float8_dev uses once, say "injected fault" and are not matched.)
      - name: No GPU task fell back to the CPU
        run: |
          bad=0
          for f in /tmp/f8_dev/log /tmp/pg_dev/log /tmp/pg_gist_dev/log /tmp/gc_dev/log; do
            [ -f "$f" ] || continue
            if grep -E "cannot create the .* pipeline|NVVM compilation failed|vkCreateComputePipelines failed|VK_ERROR_|device lost" "$f" | grep -v "injected fault" | head -5 | grep .; then
              echo "::error::$f: the GPU service reported device errors (the CPU fallback hid them from the differential tests)"; bad=1
            fi
          done
          exit $bad

      - name: Benchmark on the T4 (manual runs only, informational)
        if: github.event_name == 'workflow_dispatch' && inputs.bench_gpu
        continue-on-error: true
        timeout-minutes: 40
        env:
          PGBIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin
          GPUSERV_BIN: /usr/lib/postgresql/${{ env.PG_MAJOR }}/lib/pgstrom-gpuserv
          ALLOW_CPU: "off"
        run: |
          # the PostgreSQL side gets one worker per core of this runner (4 on a T4 runner): the "cpu8" column is then cpuN
          echo "runner: $(nproc) CPU cores, $(free -m | awk '/^Mem:/ {print $2}') MB RAM"; nvidia-smi --query-gpu=name,clocks.sm,clocks.max.sm,pcie.link.gen.current,pcie.link.width.current --format=csv
          CPU_WORKERS=$(nproc) ROOT="$RUNNER_TEMP/sp_bench" sh test/gpuserv/perf_bench.sh 2>&1 | tee "$RUNNER_TEMP/bench.out"
          echo "## T4 benchmark ($(nproc) CPU cores)" >> "$GITHUB_STEP_SUMMARY"
          grep -E ' gpu +[0-9]' "$RUNNER_TEMP/bench.out" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          # the service log has the per-task trace lines (pages, bytes, kernel time): keep it for reading the numbers
          cp "$RUNNER_TEMP/sp_bench/log" "$RUNNER_TEMP/bench_service.log" || true
          # A17: the join GROUP BY kernel was rejected (VK_ERROR_UNKNOWN) while the background prewarm was compiling; the same
          # kernel compiles on its own. The join queries again with the prewarm off (the tests run with it off): do they stay on the GPU?
          echo "## join queries with PGSTROM_GPUSERV_PREWARM=off" | tee -a "$GITHUB_STEP_SUMMARY"
          PGSTROM_GPUSERV_PREWARM=off CPU_WORKERS=$(nproc) LABEL_RE='^join' NOCPU=1 ROOT="$RUNNER_TEMP/sp_bench" sh test/gpuserv/perf_bench.sh 2>&1 | tee "$RUNNER_TEMP/bench_noprewarm.out"
          cp "$RUNNER_TEMP/sp_bench/log" "$RUNNER_TEMP/bench_service_noprewarm.log" || true

      - name: Compile the suspect kernels one by one on the T4 (manual bench runs only, informational)
        if: github.event_name == 'workflow_dispatch' && inputs.bench_gpu
        continue-on-error: true
        timeout-minutes: 40
        run: |
          # names the kernels whose pipeline the NVIDIA driver rejects (the CPU fallback hides them from the tests; A17)
          sh test/gpuserv/kernel_survey.sh src/gpuserv/build /usr/lib/postgresql/${PG_MAJOR}/lib/pgstrom-gpuserv 2>&1 | tee "$RUNNER_TEMP/bench_kernel_survey.log"

      - name: Upload the benchmark service log
        if: github.event_name == 'workflow_dispatch' && inputs.bench_gpu
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pgstrom-bench-gpu
          path: |
            ${{ runner.temp }}/bench_service.log
            ${{ runner.temp }}/bench_kernel_survey.log
            ${{ runner.temp }}/bench_service_noprewarm.log
            ${{ runner.temp }}/bench_noprewarm.out
          if-no-files-found: ignore

      - name: Save the pipeline cache (NVIDIA)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/xdg
          key: nvidia-pipeline-cache-${{ runner.arch }}-${{ hashFiles('src/gpuserv/kernels_vm/**', 'src/gpuserv/kernels/**') }}

      - name: Save the apt packages
        if: ${{ !cancelled() }}
        uses: ./.github/actions/apt-cache-save
        with:
          key-extra: gpu

      - name: Upload the PostgreSQL logs of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgstrom-test-logs-gpu
          path: |
            /tmp/f8_dev/log
            /tmp/pg_dev/log
            /tmp/pg_gist_dev/log
            /tmp/gc_dev/log
          if-no-files-found: ignore
